<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #fffdfa;
        --ink: #1a365d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #faf6f0;
        font-family: Montserrat, sans-serif;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #bg-ambient {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 20%, #fff4f6 0%, #f1f6ff 40%, #fff9ee 75%, #faefe1 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg-ambient" data-layout-ignore="true"></div>
      <div
        id="invitacion-scene"
        class="clip"
        data-composition-id="invitacion-scene"
        data-composition-src="compositions/invitacion-scene.html"
        data-start="0"
        data-duration="30"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
